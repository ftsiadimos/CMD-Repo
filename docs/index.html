<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command-CLI</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 720px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: 0.5rem;
    }
    p {
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 1.4rem;
      border-radius: 9999px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .button:hover {
      transform: translateY(-2px);
      background: #1d4ed8;
    }
    .note {
      margin-top: 2rem;
      font-size: 0.95rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Command-CLI</h1>
    <p>Welcome to the GitHub Pages preview for Command-CLI. This site is served from the repository's <code>docs/</code> folder.</p>
    <div class="buttons">
      <a class="button" href="https://github.com/ftsiadimos/CMD-Repo" target="_blank" rel="noopener">GitHub Repository</a>
    </div>
    <p class="note">To publish this page, enable GitHub Pages in the repository settings and select the <code>docs/</code> folder as the publishing source.</p>
  </div>
</body>
</html>
